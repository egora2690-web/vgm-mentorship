<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат | ВолгГМУ</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #f8fafc; }
        .vgm-green { color: #007a5e; }
        .vgm-bg-green { background-color: #007a5e; }
        .avatar-placeholder {
            background: #e2e8f0;
            display: flex; align-items: center; justify-content: center; color: #94a3b8;
        }
        .chat-messages {
            height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .message-bubble {
            max-width: 70%;
            word-wrap: break-word;
        }
        .message-own {
            background-color: #007a5e;
            color: white;
            margin-left: auto;
        }
        .message-other {
            background-color: #ffffff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body class="min-h-screen text-slate-900">

    <!-- ХЕДЕР -->
<header class="bg-white border-b border-slate-100 sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
        <a href="my-requests.html" class="text-sm font-bold text-slate-500 hover:text-slate-800 flex items-center gap-2 transition">
            ← Мои заявки
        </a>
        <h1 class="font-extrabold text-lg vgm-green">ЧАТ</h1>
        <a href="profile1.html" class="text-sm font-bold text-slate-500 hover:text-emerald-600 transition">👤 Кабинет</a>
    </div>
</header>

    <!-- ИНФО О СОБЕСЕДНИКЕ -->
    <div class="max-w-3xl mx-auto px-6 py-4">
        <div class="bg-white rounded-2xl p-4 border border-slate-100 flex items-center gap-3">
            <div id="otherAvatar" class="w-12 h-12 rounded-xl overflow-hidden avatar-placeholder flex-shrink-0"></div>
            <div>
                <h2 id="otherName" class="font-bold text-slate-800">Загрузка...</h2>
                <p id="requestStatus" class="text-xs text-slate-400 font-semibold">—</p>
            </div>
        </div>
    </div>

    <!-- СООБЩЕНИЯ -->
    <main class="max-w-3xl mx-auto px-6 pb-4">
        <div id="loadingState" class="text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
            <p class="text-slate-500 mt-2 text-sm">Загрузка сообщений...</p>
        </div>

        <div id="chatMessages" class="chat-messages space-y-3 hidden"></div>

        <div id="errorState" class="hidden text-center py-20">
            <div class="text-6xl mb-4">❌</div>
            <h3 class="text-xl font-extrabold text-slate-800 mb-2">Чат не найден</h3>
            <p class="text-slate-500 mb-6">Возможно, заявка была удалена</p>
            <a href="my-requests.html" class="bg-emerald-600 text-white font-bold px-6 py-3 rounded-xl hover:bg-emerald-700 transition">Вернуться к заявкам</a>
        </div>
    </main>

    <!-- ПОЛЕ ВВОДА -->
    <div id="inputBlock" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 p-4 hidden">
        <div class="max-w-3xl mx-auto flex gap-3">
            <input type="text" id="messageInput" placeholder="Напишите сообщение..." 
                class="flex-1 bg-slate-50 border border-slate-100 p-3 rounded-xl font-semibold text-slate-700 outline-none focus:border-emerald-500 transition"
                onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="vgm-bg-green text-white font-bold px-6 rounded-xl hover:bg-emerald-700 transition">
                Отправить
            </button>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentUser = null;
        let requestData = null;
        let otherUser = null;
        let refreshInterval = null;

        // Получаем ID заявки из URL
        const urlParams = new URLSearchParams(window.location.search);
        const requestId = urlParams.get('request');

        // Проверка авторизации
        function checkAuth() {
            const saved = localStorage.getItem('vgm_current_user');
            if (!saved) {
                alert('Войдите в аккаунт');
                window.location.href = 'profile1.html';
                return false;
            }
            currentUser = JSON.parse(saved);
            return true;
        }

        // Загрузка информации о заявке и собеседнике
        async function loadRequestInfo() {
            try {
                const response = await fetch(`${API_URL}/requests/${currentUser.id}`);
                const requests = await response.json();
                
                requestData = requests.find(r => r.id == requestId);
                
                if (!requestData) {
                    showError();
                    return;
                }

                // Определяем собеседника
                const isIncoming = requestData.to_user_id === currentUser.id;
                otherUser = {
                    id: isIncoming ? requestData.from_user_id : requestData.to_user_id,
                    name: isIncoming ? requestData.from_name : requestData.to_name,
                    avatar: isIncoming ? requestData.from_avatar : requestData.to_avatar
                };

                // Отображаем инфо
                const avatarEl = document.getElementById('otherAvatar');
                if (otherUser.avatar) {
                    avatarEl.innerHTML = `<img src="${otherUser.avatar}" class="w-full h-full object-cover">`;
                } else {
                    avatarEl.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>`;
                }
                document.getElementById('otherName').innerText = otherUser.name || 'Пользователь';

                // Статус
                const statusEl = document.getElementById('requestStatus');
                if (requestData.status === 'approved') {
                    statusEl.innerText = '✅ Заявка одобрена';
                    statusEl.className = 'text-xs text-green-600 font-semibold';
                    document.getElementById('inputBlock').classList.remove('hidden');
                } else if (requestData.status === 'pending') {
                    statusEl.innerText = '⏳ Заявка ожидает одобрения';
                    statusEl.className = 'text-xs text-yellow-600 font-semibold';
                } else {
                    statusEl.innerText = '❌ Заявка отклонена';
                    statusEl.className = 'text-xs text-red-600 font-semibold';
                }

                // Загружаем сообщения
                loadMessages();

                // Запускаем автообновление каждые 5 секунд
                refreshInterval = setInterval(loadMessages, 5000);

            } catch (error) {
                console.error(error);
                showError();
            }
        }

        // Загрузка сообщений
        async function loadMessages() {
            try {
                const response = await fetch(`${API_URL}/messages/${requestId}`);
                const messages = await response.json();

                document.getElementById('loadingState').classList.add('hidden');
                const chatEl = document.getElementById('chatMessages');
                chatEl.classList.remove('hidden');

                if (messages.length === 0) {
                    chatEl.innerHTML = `
                        <div class="text-center py-16">
                            <div class="text-5xl mb-3">💬</div>
                            <p class="text-slate-400 font-semibold">Сообщений пока нет</p>
                            <p class="text-slate-400 text-sm">Напишите первое сообщение!</p>
                        </div>
                    `;
                    return;
                }

                chatEl.innerHTML = messages.map(msg => {
                    const isOwn = msg.from_user_id === currentUser.id;
                    const time = new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

                    return `
                        <div class="flex ${isOwn ? 'justify-end' : 'justify-start'}">
                            <div class="message-bubble ${isOwn ? 'message-own' : 'message-other'} rounded-2xl px-4 py-2.5">
                                ${!isOwn ? `<p class="text-xs font-bold vgm-green mb-1">${msg.from_name || 'Пользователь'}</p>` : ''}
                                <p class="text-sm">${escapeHtml(msg.message)}</p>
                                <p class="text-[10px] opacity-70 mt-1 ${isOwn ? 'text-right' : ''}">${time}</p>
                            </div>
                        </div>
                    `;
                }).join('');

                // Прокрутка вниз
                chatEl.scrollTop = chatEl.scrollHeight;

            } catch (error) {
                console.error('Ошибка загрузки сообщений:', error);
            }
        }

        // Отправка сообщения
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            try {
                const response = await fetch(`${API_URL}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        request_id: parseInt(requestId),
                        from_user_id: currentUser.id,
                        message: message
                    })
                });

                if (response.ok) {
                    input.value = '';
                    await loadMessages();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Ошибка отправки');
                }
            } catch (error) {
                console.error(error);
                alert('Не удалось отправить сообщение');
            }
        }

        function showError() {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.remove('hidden');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Запуск
        if (checkAuth() && requestId) {
            loadRequestInfo();
        } else {
            showError();
        }
    </script>

</body>
</html>
