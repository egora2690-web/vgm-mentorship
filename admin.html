<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | ВолгГМУ</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #f8fafc; }
        .vgm-green { color: #007a5e; }
        .vgm-bg-green { background-color: #007a5e; }
        .avatar-placeholder {
            background: #e2e8f0;
            display: flex; align-items: center; justify-content: center; color: #94a3b8;
        }
        .tab-btn { transition: all 0.2s; }
        .tab-btn.active { background-color: #007a5e; color: white; }
        .tab-btn:not(.active) { background-color: #f1f5f9; color: #64748b; }
    </style>
</head>
<body class="min-h-screen text-slate-900">

    <!-- ХЕДЕР -->
    <header class="bg-white border-b border-slate-100 sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="profile1.html" class="text-sm font-bold text-slate-500 hover:text-slate-800 flex items-center gap-2 transition">
                ← Личный кабинет
            </a>
            <h1 class="font-extrabold text-lg text-red-600">🔐 АДМИН-ПАНЕЛЬ</h1>
            <a href="catalog.html" class="text-sm font-bold text-slate-500 hover:text-emerald-600 transition">🎓 Каталог</a>
        </div>
    </header>

    <!-- ПРОВЕРКА ДОСТУПА -->
    <div id="accessDenied" class="hidden max-w-md mx-auto text-center py-20">
        <div class="text-6xl mb-4">🚫</div>
        <h3 class="text-xl font-extrabold text-slate-800 mb-2">Доступ запрещён</h3>
        <p class="text-slate-500 mb-6">У вас нет прав администратора</p>
        <a href="profile1.html" class="bg-emerald-600 text-white font-bold px-6 py-3 rounded-xl hover:bg-emerald-700 transition inline-block">Вернуться в профиль</a>
    </div>

    <!-- АДМИН-ПАНЕЛЬ -->
    <main id="adminPanel" class="hidden max-w-6xl mx-auto p-6">

        <!-- СТАТИСТИКА -->
        <section class="mb-8">
            <h2 class="text-2xl font-extrabold text-slate-800 mb-4">📊 Статистика</h2>
            <div id="statsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Заполнится через JS -->
            </div>
        </section>

        <!-- ВКЛАДКИ -->
        <div class="flex gap-2 mb-6 border-b border-slate-200">
            <button onclick="switchTab('users')" id="usersTabBtn" class="tab-btn active px-5 py-3 text-sm font-bold rounded-t-xl">
                👥 Пользователи
            </button>
            <button onclick="switchTab('requests')" id="requestsTabBtn" class="tab-btn px-5 py-3 text-sm font-bold rounded-t-xl">
                📋 Заявки
            </button>
        </div>

        <!-- СПИСОК ПОЛЬЗОВАТЕЛЕЙ -->
        <section id="usersTab">
            <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
                <div id="usersLoading" class="text-center py-10">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
                </div>
                <div id="usersList" class="divide-y divide-slate-100"></div>
            </div>
        </section>

        <!-- СПИСОК ЗАЯВОК -->
        <section id="requestsTab" class="hidden">
            <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
                <div id="requestsLoading" class="text-center py-10">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
                </div>
                <div id="requestsList" class="divide-y divide-slate-100"></div>
            </div>
        </section>

    </main>

    <script>
        const API_URL = '/api';
        let currentUser = null;
        let allUsers = [];
        let allRequests = [];

        // Проверка админа
        function checkAdmin() {
            const saved = localStorage.getItem('vgm_current_user');
            if (!saved) {
                document.getElementById('accessDenied').classList.remove('hidden');
                return false;
            }
            currentUser = JSON.parse(saved);
            
            if (!currentUser.is_admin) {
                document.getElementById('accessDenied').classList.remove('hidden');
                return false;
            }
            
            document.getElementById('adminPanel').classList.remove('hidden');
            return true;
        }

        // Заголовки для API админа
        function adminHeaders() {
            return {
                'Content-Type': 'application/json',
                'x-user-id': currentUser.id
            };
        }

        // Переключение вкладок
        function switchTab(tab) {
            document.getElementById('usersTabBtn').classList.toggle('active', tab === 'users');
            document.getElementById('requestsTabBtn').classList.toggle('active', tab === 'requests');
            document.getElementById('usersTab').classList.toggle('hidden', tab !== 'users');
            document.getElementById('requestsTab').classList.toggle('hidden', tab !== 'requests');
        }

        // Загрузка статистики
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/admin/stats`, { headers: adminHeaders() });
                const stats = await response.json();

                document.getElementById('statsGrid').innerHTML = `
                    <div class="bg-white rounded-2xl p-5 border border-slate-100">
                        <div class="text-3xl mb-2">👥</div>
                        <p class="text-2xl font-extrabold text-slate-800">${stats.total_users}</p>
                        <p class="text-xs font-bold text-slate-400 uppercase">Всего пользователей</p>
                    </div>
                    <div class="bg-white rounded-2xl p-5 border border-slate-100">
                        <div class="text-3xl mb-2">🎓</div>
                        <p class="text-2xl font-extrabold text-emerald-600">${stats.total_mentors}</p>
                        <p class="text-xs font-bold text-slate-400 uppercase">Наставники</p>
                    </div>
                    <div class="bg-white rounded-2xl p-5 border border-slate-100">
                        <div class="text-3xl mb-2">👨‍🎓</div>
                        <p class="text-2xl font-extrabold text-blue-600">${stats.total_mentees}</p>
                        <p class="text-xs font-bold text-slate-400 uppercase">Подопечные</p>
                    </div>
                    <div class="bg-white rounded-2xl p-5 border border-slate-100">
                        <div class="text-3xl mb-2">📋</div>
                        <p class="text-2xl font-extrabold text-slate-800">${stats.total_requests}</p>
                        <p class="text-xs font-bold text-slate-400 uppercase">Заявок</p>
                    </div>
                    <div class="bg-white rounded-2xl p-5 border border-slate-100">
                        <div class="text-3xl mb-2">⏳</div>
                        <p class="text-2xl font-extrabold text-yellow-600">${stats.pending_requests}</p>
                        <p class="text-xs font-bold text-slate-400 uppercase">Ожидают</p>
                    </div>
                    <div class="bg-white rounded-2xl p-5 border border-slate-100">
                        <div class="text-3xl mb-2">✅</div>
                        <p class="text-2xl font-extrabold text-green-600">${stats.approved_requests}</p>
                        <p class="text-xs font-bold text-slate-400 uppercase">Одобрено</p>
                    </div>
                    <div class="bg-white rounded-2xl p-5 border border-slate-100">
                        <div class="text-3xl mb-2">💬</div>
                        <p class="text-2xl font-extrabold text-slate-800">${stats.total_messages}</p>
                        <p class="text-xs font-bold text-slate-400 uppercase">Сообщений</p>
                    </div>
                `;
            } catch (error) {
                console.error(error);
            }
        }

        // Загрузка пользователей
        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/admin/users`, { headers: adminHeaders() });
                allUsers = await response.json();
                
                document.getElementById('usersLoading').classList.add('hidden');
                renderUsers();
            } catch (error) {
                console.error(error);
                document.getElementById('usersLoading').innerHTML = 
                    '<p class="text-red-500 font-bold">Ошибка загрузки</p>';
            }
        }

        function renderUsers() {
            const list = document.getElementById('usersList');
            
            if (allUsers.length === 0) {
                list.innerHTML = '<p class="text-center py-10 text-slate-400">Нет пользователей</p>';
                return;
            }

            list.innerHTML = allUsers.map(u => {
                const isSelf = u.id === currentUser.id;
                const avatarHTML = u.avatar
                    ? `<img src="${u.avatar}" class="w-full h-full object-cover">`
                    : `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>`;

                const directionInfo = u.direction 
                    ? `<p class="text-xs text-slate-400">${u.direction.name} • ${u.direction.level}</p>` 
                    : '';

                const adminBadge = u.is_admin 
                    ? '<span class="bg-red-100 text-red-700 text-[10px] px-2 py-1 rounded-full font-bold">👑 АДМИН</span>' 
                    : '';

                const date = new Date(u.created_at).toLocaleDateString('ru-RU');

                return `
                    <div class="p-4 flex items-center gap-4 hover:bg-slate-50 transition">
                        <div class="w-12 h-12 rounded-xl overflow-hidden avatar-placeholder flex-shrink-0">
                            ${avatarHTML}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="font-bold text-slate-800">${u.name}</h3>
                                ${adminBadge}
                            </div>
                            <p class="text-xs text-slate-400">@${u.login} • ${u.role}</p>
                            ${directionInfo}
                        </div>
                        <div class="text-right flex-shrink-0">
                            <p class="text-xs text-slate-400 mb-2">${date}</p>
                            <div class="flex gap-2">
                                ${!u.is_admin ? `
                                    <button onclick="makeAdmin(${u.id})" class="text-xs bg-yellow-50 text-yellow-700 px-3 py-1.5 rounded-lg font-bold hover:bg-yellow-100 transition">
                                        👑 Сделать админом
                                    </button>
                                ` : (isSelf ? '' : `
                                    <button onclick="removeAdmin(${u.id})" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg font-bold hover:bg-slate-200 transition">
                                        Снять админа
                                    </button>
                                `)}
                                ${!isSelf ? `
                                    <button onclick="deleteUser(${u.id}, '${u.name.replace(/'/g, "\\'")}')" class="text-xs bg-red-50 text-red-700 px-3 py-1.5 rounded-lg font-bold hover:bg-red-100 transition">
                                        🗑 Удалить
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Загрузка заявок
        async function loadRequests() {
            try {
                const response = await fetch(`${API_URL}/admin/requests`, { headers: adminHeaders() });
                allRequests = await response.json();
                
                document.getElementById('requestsLoading').classList.add('hidden');
                renderRequests();
            } catch (error) {
                console.error(error);
            }
        }

        function renderRequests() {
            const list = document.getElementById('requestsList');
            
            if (allRequests.length === 0) {
                list.innerHTML = '<p class="text-center py-10 text-slate-400">Нет заявок</p>';
                return;
            }

            list.innerHTML = allRequests.map(r => {
                let statusBadge = '';
                if (r.status === 'pending') statusBadge = '<span class="bg-yellow-50 text-yellow-700 px-2 py-1 rounded-lg text-xs font-bold">⏳ Ожидает</span>';
                else if (r.status === 'approved') statusBadge = '<span class="bg-green-50 text-green-700 px-2 py-1 rounded-lg text-xs font-bold">✅ Одобрена</span>';
                else if (r.status === 'rejected') statusBadge = '<span class="bg-red-50 text-red-700 px-2 py-1 rounded-lg text-xs font-bold">❌ Отклонена</span>';

                const date = new Date(r.created_at).toLocaleDateString('ru-RU');

                return `
                    <div class="p-4 hover:bg-slate-50 transition">
                        <div class="flex justify-between items-start mb-2 flex-wrap gap-2">
                            <div>
                                <p class="font-bold text-slate-800">${r.from_name} → ${r.to_name}</p>
                                <p class="text-xs text-slate-400">${date}</p>
                            </div>
                            ${statusBadge}
                        </div>
                        ${r.message ? `<p class="text-sm text-slate-600 mb-3">"${r.message}"</p>` : ''}
                        <button onclick="deleteRequest(${r.id})" class="text-xs bg-red-50 text-red-700 px-3 py-1.5 rounded-lg font-bold hover:bg-red-100 transition">
                            🗑 Удалить заявку
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Действия
        async function makeAdmin(id) {
            if (!confirm('Сделать пользователя админом?')) return;
            await fetch(`${API_URL}/admin/users/${id}/make-admin`, { method: 'PUT', headers: adminHeaders() });
            loadUsers();
        }

        async function removeAdmin(id) {
            if (!confirm('Снять права админа?')) return;
            await fetch(`${API_URL}/admin/users/${id}/remove-admin`, { method: 'PUT', headers: adminHeaders() });
            loadUsers();
        }

        async function deleteUser(id, name) {
            if (!confirm(`Удалить пользователя "${name}"? Это действие нельзя отменить!`)) return;
            await fetch(`${API_URL}/admin/users/${id}`, { method: 'DELETE', headers: adminHeaders() });
            loadUsers();
            loadStats();
        }

        async function deleteRequest(id) {
            if (!confirm('Удалить заявку?')) return;
            await fetch(`${API_URL}/admin/requests/${id}`, { method: 'DELETE', headers: adminHeaders() });
            loadRequests();
            loadStats();
        }

        // Запуск
        if (checkAdmin()) {
            loadStats();
            loadUsers();
            loadRequests();
        }
    </script>

</body>
</html>
