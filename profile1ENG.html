                <!-- NAVIGATION TILES -->

            <div class="space-y-4">
                <h3 class="text-sm font-extrabold text-slate-400 uppercase tracking-widest px-2">Management</h3>
                
                <a href="my-requestsENG.html" class="w-full bg-white border border-slate-100 p-5 rounded-[24px] flex justify-between items-center card-shadow active:scale-[0.97] transition cursor-pointer block">
                    <div class="flex items-center gap-4">

                    <span id="requestsBadge" class="bg-red-500 text-white text-[10px] px-2 py-1 rounded-full font-black hidden">0</span>

                <div role="button" onclick="openEditModal()" class="w-full bg-white border border-slate-100 p-5 rounded-[24px] flex justify-between items-center card-shadow active:scale-[0.97] transition cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-600">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </div>
                        <span class="font-bold text-slate-700">Edit Profile</span>
                    </div>
                    <svg class="text-slate-300" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </div>

            <button onclick="logoutUser()" class="w-full mt-12 py-4 text-slate-400 font-bold text-sm hover:text-red-500 transition">
                Log Out

        </main>

    <!-- EDIT MODAL -->
    <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden justify-center items-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-6 shadow-2xl relative border border-slate-100 max-h-[90vh] overflow-y-auto">
            <button onclick="closeEditModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            
            <h3 class="text-xl font-extrabold text-slate-800 mb-5">Edit Profile</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Full Name</label>
                    <input type="text" id="input-name" class="w-full bg-slate-50 border border-slate-100 p-3 rounded-xl font-semibold text-slate-700 outline-none focus:border-emerald-500 transition">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Role</label>
                    <select id="input-role" class="w-full bg-slate-50 border border-slate-100 p-3 rounded-xl font-semibold text-slate-700 outline-none focus:border-emerald-500 transition">
                        <option value="Mentor VolgGMU">Mentor</option>
                        <option value="Mentee">Mentee</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Direction</label>
                    <select id="edit-direction" class="w-full bg-slate-50 border border-slate-100 p-3 rounded-xl font-semibold text-slate-700 outline-none focus:border-emerald-500 transition direction-select" onchange="updateDirectionDetails('edit')">
                        <option value="">Select direction</option>
                        <optgroup label="Bachelor's Degree">
                            <option value='{"level":"Bachelor'"'"'s Degree","name":"Biology","form":"Full-time","duration":"4 years"}'>Biology</option>
                            <option value='{"level":"Bachelor'"'"'s Degree","name":"Biotechnical Systems and Technologies","form":"Full-time","duration":"4 years"}'>Biotechnical Systems and Technologies</option>
                        </optgroup>
                        <optgroup label="Specialist Degree">
                            <option value='{"level":"Specialist Degree","name":"General Medicine","form":"Full-time","duration":"6 years","code":"31.05.01"}'>General Medicine</option>
                            <option value='{"level":"Specialist Degree","name":"Pediatrics","form":"Full-time","duration":"6 years","code":"31.05.02"}'>Pediatrics</option>
                            <option value='{"level":"Specialist Degree","name":"Dentistry","form":"Full-time","duration":"5 years","code":"31.05.03"}'>Dentistry</option>
                        </optgroup>
                        <optgroup label="Master's Degree">
                            <option value='{"level":"Master'"'"'s Degree","name":"Biotechnical Systems and Technologies","form":"Full-time","duration":"2 years"}'>Biotechnical Systems and Technologies</option>
                            <option value='{"level":"Master'"'"'s Degree","name":"Management","form":"Part-time","duration":"2 years 6 months"}'>Management</option>
                        </optgroup>
                        <optgroup label="Residency">
                            <option value='{"level":"Residency","name":"Surgery","form":"Full-time","duration":"2 years"}'>Surgery</option>
                            <option value='{"level":"Residency","name":"Pediatrics","form":"Full-time","duration":"2 years"}'>Pediatrics</option>
                        </optgroup>
                        <optgroup label="Postgraduate Studies">
                            <option value='{"level":"Postgraduate","name":"Hygiene","form":"Full-time","duration":"3 years"}'>Hygiene</option>
                        </optgroup>
                    </select>
                </div>
                <div id="edit-direction-details" class="spec-details"></div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Profile Photo</label>
                    <div class="flex items-center gap-3">
                        <label class="flex-1 bg-slate-50 border border-slate-100 p-3 rounded-xl text-center text-slate-500 font-semibold text-sm cursor-pointer hover:bg-slate-100 transition">
                            Choose photo
                            <input type="file" id="edit-avatar-file" accept="image/*" class="hidden" onchange="previewAvatar(event, 'edit-avatar-preview')">
                        </label>
                        <div id="edit-avatar-preview" class="w-14 h-14 rounded-full border-2 border-slate-200 overflow-hidden flex-shrink-0 avatar-placeholder">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-3 mt-6">
                <button onclick="saveChanges()" class="flex-1 vgm-bg-green text-white font-bold py-3 rounded-xl active:scale-[0.97] transition shadow-sm">
                    Save
                </button>
                <button onclick="closeEditModal()" class="flex-1 bg-slate-100 text-slate-500 font-bold py-3 rounded-xl active:scale-[0.97] transition">
                    Cancel
                </button>
            </div>
        </div>

    <footer class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-lg border-t border-slate-50 p-4 flex justify-around items-center z-10">
        <button onclick="window.location.href='indexENG.html'" class="text-slate-300">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
        <button class="text-emerald-700 font-bold">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
    </footer>

    <script>
        const API_URL = '/api';

        let regAvatarDataURL = null;
        let editAvatarDataURL = null;
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", function() {
            checkAuth();
        });

        function switchAuthTab(tab) {
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('registerTab').classList.remove('active');
            document.getElementById('loginTabBtn').classList.remove('active');
            document.getElementById('registerTabBtn').classList.remove('active');
            
            if (tab === 'login') {
                document.getElementById('loginTab').classList.add('active');
                document.getElementById('loginTabBtn').classList.add('active');
            } else {
                document.getElementById('registerTab').classList.add('active');
                document.getElementById('registerTabBtn').classList.add('active');
            }
        }

        function updateDirectionDetails(prefix) {
            const select = document.getElementById(prefix + '-direction');
            const detailsDiv = document.getElementById(prefix + '-direction-details');
            const selectedOption = select.options[select.selectedIndex];
            
            if (!selectedOption || !selectedOption.value) {
                detailsDiv.classList.remove('show');
                detailsDiv.innerHTML = '';
                return;
            }

            try {
                const data = JSON.parse(selectedOption.value);
                
                let html = `<div class="detail-row"><span class="detail-label">Level</span><span class="detail-value">${data.level}</span></div>`;
                html += `<div class="detail-row"><span class="detail-label">Direction</span><span class="detail-value">${data.name}</span></div>`;
                
                if (data.code) {
                    html += `<div class="detail-row"><span class="detail-label">Direction Code</span><span class="detail-value code">${data.code}</span></div>`;
                }
                
                if (data.description) {
                    html += `<div class="detail-description">${data.description}</div>`;
                }
                
                html += `<div class="detail-row"><span class="detail-label">Study Format</span><span class="detail-value">${data.form}</span></div>`;
                html += `<div class="detail-row"><span class="detail-label">Study Duration</span><span class="detail-value">${data.duration}</span></div>`;
                
                detailsDiv.innerHTML = html;
                detailsDiv.classList.add('show');
            } catch (e) {
                detailsDiv.classList.remove('show');
                detailsDiv.innerHTML = '';
            }
        }

        function previewAvatar(event, previewId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataURL = e.target.result;
                const previewEl = document.getElementById(previewId);
                previewEl.innerHTML = `<img src="${dataURL}" class="w-full h-full object-cover">`;
                if (previewId === 'reg-avatar-preview') {
                    regAvatarDataURL = dataURL;
                } else if (previewId === 'edit-avatar-preview') {
                    editAvatarDataURL = dataURL;
                }
            };
            reader.readAsDataURL(file);
        }

        async function registerUser() {
            const login = document.getElementById("reg-login").value.trim();
            const name = document.getElementById("reg-name").value.trim();
            const role = document.getElementById("reg-role").value;
            const password = document.getElementById("reg-password").value;
            const passwordConfirm = document.getElementById("reg-password-confirm").value;
            const select = document.getElementById("reg-direction");
            const selectedOption = select.options[select.selectedIndex];

            if (!login || !name || !password || !passwordConfirm) {
                alert("Please fill in all fields!");
                return;
            }
            if (password !== passwordConfirm) {
                alert("Passwords do not match!");
                return;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters!");
                return;
            }
            if (!selectedOption || !selectedOption.value) {
                alert("Please select a direction!");
                return;
            }

            let directionData;
            try {
                directionData = JSON.parse(selectedOption.value);
            } catch (e) {
                alert("Error in direction data!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        login, name, password, role,
                        direction: directionData,
                        avatar: regAvatarDataURL
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || 'Registration error');
                    return;
                }

                currentUser = data.user;
                localStorage.setItem('vgm_current_user', JSON.stringify(data.user));
                alert('Registration successful!');
                checkAuth();

            } catch (error) {
                console.error(error);
                alert('Could not connect to server.');
            }
        }

        async function loginUser() {
            const login = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value;

            if (!login || !password) {
                alert("Enter username and password!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || 'Login error');
                    return;
                }

                currentUser = data.user;
                localStorage.setItem('vgm_current_user', JSON.stringify(data.user));
                checkAuth();

            } catch (error) {
                console.error(error);
                alert('Could not connect to server.');
            }
        }

        function logoutUser() {
            currentUser = null;
            localStorage.removeItem('vgm_current_user');
            checkAuth();
        }

        function checkAuth() {
            const saved = localStorage.getItem('vgm_current_user');
            
            if (saved) {
                currentUser = JSON.parse(saved);
                
                document.getElementById("authBlock").classList.add("hidden");
                document.getElementById("profileBlock").classList.remove("hidden");
                
                document.getElementById("profile-name").innerText = currentUser.name;
                document.getElementById("profile-status").innerText = currentUser.role;
                
                if (currentUser.direction) {
                    document.getElementById("profile-tag").innerText = currentUser.direction.name;
                    document.getElementById("profile-level").innerText = currentUser.direction.level;
                }
                
                updateProfileAvatar(currentUser.avatar);
                loadRequestsCount();
            } else {
                document.getElementById("authBlock").classList.remove("hidden");
                document.getElementById("profileBlock").classList.add("hidden");
                
                document.getElementById("reg-login").value = '';
                document.getElementById("reg-name").value = '';
                document.getElementById("reg-password").value = '';
                document.getElementById("reg-password-confirm").value = '';
                document.getElementById("login-username").value = '';
                document.getElementById("login-password").value = '';
                document.getElementById("reg-avatar-file").value = '';
                regAvatarDataURL = null;
                
                const preview = document.getElementById('reg-avatar-preview');
                preview.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>`;
                
                document.getElementById('reg-direction').value = '';
                document.getElementById('reg-direction-details').classList.remove('show');
                document.getElementById('reg-direction-details').innerHTML = '';
            }
        }

        function updateProfileAvatar(dataURL) {
            const img = document.getElementById('profile-avatar');
            const placeholder = document.getElementById('avatar-placeholder-icon');
            const container = document.getElementById('avatar-container');
            if (dataURL && dataURL !== 'null' && dataURL !== '') {
                img.src = dataURL;
                img.classList.remove('hidden');
                placeholder.classList.add('hidden');
                container.classList.remove('avatar-placeholder');
            } else {
                img.classList.add('hidden');
                placeholder.classList.remove('hidden');
                container.classList.add('avatar-placeholder');
            }
        }

        async function loadRequestsCount() {
            if (!currentUser) return;
            
            try {
                const response = await fetch(`${API_URL}/requests/${currentUser.id}`);
                const requests = await response.json();
                
                const incomingPending = requests.filter(r => 
                    r.to_user_id === currentUser.id && r.status === 'pending'
                ).length;
                
                const badge = document.getElementById('requestsBadge');
                if (badge) {
                    if (incomingPending > 0) {
                        badge.innerText = incomingPending;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }
            } catch (e) {
                console.error('Error loading requests:', e);
            }
        }

        function openEditModal() {
            if (!currentUser) return;
            
            document.getElementById("input-name").value = currentUser.name || '';
            
            const roleSelect = document.getElementById("input-role");
            if ((currentUser.role || '').includes("Mentor")) {
                roleSelect.value = "Mentor VolgGMU";
            } else {
                roleSelect.value = "Mentee";
            }
            
            const editSelect = document.getElementById("edit-direction");
            const currentTag = currentUser.direction ? currentUser.direction.name : '';
            const currentLevel = currentUser.direction ? currentUser.direction.level : '';
            
            for (let i = 0; i < editSelect.options.length; i++) {
                const opt = editSelect.options[i];
                if (opt.value) {
                    try {
                        const data = JSON.parse(opt.value);
                        if (data.name === currentTag && data.level === currentLevel) {
                            editSelect.value = opt.value;
                            updateDirectionDetails('edit');
                            break;
                        }
                    } catch(e) {}
                }
            }
            
            const previewEl = document.getElementById('edit-avatar-preview');
            if (currentUser.avatar) {
                previewEl.innerHTML = `<img src="${currentUser.avatar}" class="w-full h-full object-cover">`;
                editAvatarDataURL = currentUser.avatar;
            } else {
                previewEl.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>`;
                editAvatarDataURL = null;
            }
            document.getElementById('edit-avatar-file').value = '';
            
            document.getElementById("editModal").style.display = "flex";
        }

        function closeEditModal() {
            document.getElementById("editModal").style.display = "none";
        }

        async function saveChanges() {
            if (!currentUser) return;
            
            const newName = document.getElementById("input-name").value.trim();
            const newRole = document.getElementById("input-role").value;
            
            const editSelect = document.getElementById("edit-direction");
            const selectedOption = editSelect.options[editSelect.selectedIndex];
            
            let directionData = currentUser.direction;
            if (selectedOption && selectedOption.value) {
                try {
                    directionData = JSON.parse(selectedOption.value);
                } catch(e) {}
            }

            try {
                const response = await fetch(`${API_URL}/users/${currentUser.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: newName || currentUser.name,
                        role: newRole,
                        direction: directionData,
                        avatar: editAvatarDataURL
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    currentUser = data.user;
                    localStorage.setItem('vgm_current_user', JSON.stringify(data.user));
                    
                    document.getElementById("profile-name").innerText = currentUser.name;
                    document.getElementById("profile-status").innerText = currentUser.role;
                    
                    if (currentUser.direction) {
                        document.getElementById("profile-tag").innerText = currentUser.direction.name;
                        document.getElementById("profile-level").innerText = currentUser.direction.level;
                    }
                    
                    updateProfileAvatar(currentUser.avatar);
                    closeEditModal();
                } else {
                    alert(data.error || 'Save error');
                }

            } catch (error) {
                console.error(error);
                alert('Could not connect to server');
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById("editModal");
            if (event.target == modal) {
                closeEditModal();
            }
        }
    </script>
