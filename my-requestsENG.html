<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests | VolgSMU</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #f8fafc; }
        .vgm-green { color: #007a5e; }
        .vgm-bg-green { background-color: #007a5e; }
        .avatar-placeholder {
            background: #e2e8f0;
            display: flex; align-items: center; justify-content: center; color: #94a3b8;
        }
        .tab-btn { transition: all 0.2s; }
        .tab-btn.active { background-color: #007a5e; color: white; }
        .tab-btn:not(.active) { background-color: #f1f5f9; color: #64748b; }
        .tab-btn:not(.active):hover { background-color: #e2e8f0; }
    </style>
</head>
<body class="min-h-screen text-slate-900">

    <header class="bg-white border-b border-slate-100 sticky top-0 z-20">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="profile1ENG.html" class="text-sm font-bold text-slate-500 hover:text-slate-800 flex items-center gap-2 transition">
                ← Personal Account
            </a>
            <h1 class="font-extrabold text-lg vgm-green">MY REQUESTS</h1>
            <a href="catalogENG.html" class="text-sm font-bold text-slate-500 hover:text-emerald-600 transition">🎓 Catalog</a>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-6 py-6">
        <div class="flex rounded-xl overflow-hidden border border-slate-200 bg-white">
            <button onclick="switchTab('incoming')" id="incomingTabBtn" class="tab-btn active flex-1 py-3 text-sm font-bold">
                📥 Incoming
            </button>
            <button onclick="switchTab('outgoing')" id="outgoingTabBtn" class="tab-btn flex-1 py-3 text-sm font-bold">
                📤 Outgoing
            </button>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-6 pb-16">

        <div id="loadingState" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-emerald-500 border-t-transparent"></div>
            <p class="text-slate-500 mt-4">Loading requests...</p>
        </div>

        <div id="requestsList" class="hidden space-y-4"></div>

        <div id="emptyState" class="hidden text-center py-20">
            <div class="text-6xl mb-4">📭</div>
            <h3 class="text-xl font-extrabold text-slate-800 mb-2">No requests yet</h3>
            <p class="text-slate-500 mb-6">Student requests will appear here</p>
            <a href="catalogENG.html" class="bg-emerald-600 text-white font-bold px-6 py-3 rounded-xl hover:bg-emerald-700 transition inline-block">Find a mentor</a>
        </div>

        <div id="authError" class="hidden text-center py-20">
            <div class="text-6xl mb-4">🔒</div>
            <h3 class="text-xl font-extrabold text-slate-800 mb-2">You are not signed in</h3>
            <p class="text-slate-500 mb-6">Sign in to view requests</p>
            <a href="profile1ENG.html" class="bg-emerald-600 text-white font-bold px-6 py-3 rounded-xl hover:bg-emerald-700 transition inline-block">Sign In</a>
        </div>

    </main>

    <script>
        const API_URL = '/api';
        let currentUser = null;
        let allRequests = [];
        let currentTab = 'incoming';

        function checkAuth() {
            const saved = localStorage.getItem('vgm_current_user');
            if (!saved) {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('authError').classList.remove('hidden');
                return false;
            }
            currentUser = JSON.parse(saved);
            return true;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('incomingTabBtn').classList.toggle('active', tab === 'incoming');
            document.getElementById('outgoingTabBtn').classList.toggle('active', tab === 'outgoing');
            renderRequests();
        }

        async function loadRequests() {
            if (!checkAuth()) return;

            try {
                const response = await fetch(`${API_URL}/requests/${currentUser.id}`);
                const data = await response.json();
                allRequests = data;
                renderRequests();
            } catch (error) {
                console.error(error);
                document.getElementById('loadingState').innerHTML = 
                    '<p class="text-red-500 font-bold">Error loading requests</p>';
            }
        }

        function renderRequests() {
            const list = document.getElementById('requestsList');
            const empty = document.getElementById('emptyState');
            const loading = document.getElementById('loadingState');

            loading.classList.add('hidden');

            let filtered;
            if (currentTab === 'incoming') {
                filtered = allRequests.filter(r => r.to_user_id === currentUser.id);
            } else {
                filtered = allRequests.filter(r => r.from_user_id === currentUser.id);
            }

            if (filtered.length === 0) {
                list.innerHTML = '';
                list.classList.add('hidden');
                empty.classList.remove('hidden');
                document.querySelector('#emptyState h3').innerText = 
                    currentTab === 'incoming' ? 'No incoming requests' : 'You haven\'t sent any requests';
                return;
            }

            empty.classList.add('hidden');
            list.classList.remove('hidden');

            list.innerHTML = filtered.map(req => {
                const isIncoming = req.to_user_id === currentUser.id;
                const otherName = isIncoming ? req.from_name : req.to_name;
                const otherAvatar = isIncoming ? req.from_avatar : req.to_avatar;

                const avatarHTML = otherAvatar
                    ? `<img src="${otherAvatar}" class="w-full h-full object-cover">`
                    : `<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>`;

                let statusBadge = '';
                if (req.status === 'pending') {
                    statusBadge = '<span class="bg-yellow-50 text-yellow-700 px-3 py-1 rounded-full text-xs font-bold">⏳ Pending</span>';
                } else if (req.status === 'approved') {
                    statusBadge = '<span class="bg-green-50 text-green-700 px-3 py-1 rounded-full text-xs font-bold">✅ Approved</span>';
                } else if (req.status === 'rejected') {
                    statusBadge = '<span class="bg-red-50 text-red-700 px-3 py-1 rounded-full text-xs font-bold">❌ Declined</span>';
                }

                let actionsHTML = '';
                if (isIncoming && req.status === 'pending') {
                    actionsHTML = `
                        <div class="flex gap-3 mt-4">
                            <button onclick="updateRequest(${req.id}, 'approved')" 
                                class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition">
                                ✅ Approve
                            </button>
                            <button onclick="updateRequest(${req.id}, 'rejected')" 
                                class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 rounded-xl transition">
                                ❌ Decline
                            </button>
                        </div>
                    `;
                } else if (req.status === 'approved' && req.chat_link) {
                    actionsHTML = `
                        <a href="${req.chat_link}" 
                            class="block mt-4 w-full vgm-bg-green text-white font-bold py-2.5 rounded-xl text-center hover:bg-emerald-700 transition">
                            💬 Open Chat
                        </a>
                    `;
                }

                const date = new Date(req.created_at).toLocaleDateString('en-US', {
                    day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                return `
                    <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm">
                        <div class="flex items-start gap-4">
                            <div class="w-16 h-16 rounded-2xl overflow-hidden avatar-placeholder flex-shrink-0">
                                ${avatarHTML}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start gap-3 flex-wrap">
                                    <div>
                                        <h3 class="font-extrabold text-lg text-slate-800">${otherName || 'User'}</h3>
                                        <p class="text-xs text-slate-400 font-semibold">${isIncoming ? 'wants to work with you' : 'you sent a request'}</p>
                                    </div>
                                    ${statusBadge}
                                </div>
                                <p class="text-xs text-slate-400 mt-2">${date}</p>
                            </div>
                        </div>

                        ${req.message ? `
                            <div class="mt-4 bg-slate-50 rounded-xl p-4">
                                <p class="text-sm text-slate-700">${req.message}</p>
                            </div>
                        ` : ''}

                        ${actionsHTML}
                    </div>
                `;
            }).join('');
        }

        async function updateRequest(id, status) {
            if (status === 'rejected' && !confirm('Decline this request?')) return;

            try {
                const response = await fetch(`${API_URL}/requests/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });

                const data = await response.json();

                if (response.ok) {
                    if (status === 'approved') {
                        alert('Request approved! Chat created.');
                    }
                    loadRequests();
                } else {
                    alert(data.error || 'Error');
                }
            } catch (error) {
                console.error(error);
                alert('Failed to update request');
            }
        }

        loadRequests();
    </script>

</body>
</html>
